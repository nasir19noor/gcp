# Every setting of the landing zone. Each stage reads this file; nothing is
# hard-coded in the Terraform.

gcp:
  org_id: "1085796438163"
  domain: "nasir.id"
  customer_id: "C0384bjrt"                # Cloud Identity customer, for domain-restricted sharing
  billing_account: "017E13-779EF0-74B8F6"
  region: "asia-southeast1"
  state_bucket: "nasir-terraform-state-bucket"   # must match backend.conf

# Names follow Google's security foundations blueprint:
#   folders   fldr-<name>                      fldr-common
#   projects  prj-<env code>-<name>-<random>   prj-c-logging-a1b2
#   networks  vpc-<env code>-shared-base       vpc-p-shared-base
#   subnets   sb-<env code>-shared-base-<region>
naming:
  folder_prefix: "fldr"
  project_prefix: "prj"
  env_codes:
    bootstrap: "b"
    common: "c"
    production: "p"
    nonproduction: "n"

github:
  repo: "nasir19noor/gcp"
  repo_id: "1445073393"                   # immutable: survives renames and transfers
  branch: "main"

# IAM members, with their type: "user:", "group:" or "serviceAccount:".
# These are users for now; to switch to Google groups later, create the group
# and change the prefix to "group:".
principals:
  org_admins: "user:gcp@nasir.id"
  billing_admins: "user:gcp-billing@nasir.id"
  network_admins: "user:gcp-network@nasir.id"
  security_admins: "user:gcp-security@nasir.id"
  devops: "user:gcp-devops@nasir.id"
  developers: "user:gcp-developers@nasir.id"

# 0-bootstrap
bootstrap:
  service_account: "sa-terraform"
  wif_pool: "github"
  wif_provider: "github-actions"

# 2-env and 3-networks.
#   cidr          the environment's whole range, reserved for its subnets
#   subnet        the first subnet, in gcp.region, taken from cidr
#   nat           Cloud NAT for VMs without a public IP (billed hourly)
#   folder_roles  roles on fldr-<env>, by principal
environments:
  production:
    cidr: "10.10.0.0/16"
    subnet: "10.10.0.0/20"
    nat: false
    folder_roles:
      devops: ["roles/editor"]
      developers: ["roles/viewer"]
  nonproduction:
    cidr: "10.20.0.0/16"
    subnet: "10.20.0.0/20"
    nat: false
    folder_roles:
      devops: ["roles/editor"]
      developers: ["roles/editor"]

# 3-networks: firewall baseline. Ingress not allowed here is denied (GCP's
# implied deny rule).
network:
  iap_ranges: ["35.235.240.0/20"]   # Identity-Aware Proxy, for SSH without public IPs

# 1-org/envs/shared
org:
  essential_contact: "nasir@nasir.id"     # Google's security, billing, legal and technical notices
  log_retention_days: 30                  # central audit log bucket in prj-c-logging
  budget:                                 # whole billing account, monthly
    amount: 50000                        # about USD 10
    currency: "IDR"                       # must be the billing account's currency
    alert_at: [0.5, 0.9, 1.0]             # of the amount; e-mailed to essential_contact
  policies:
    # Boolean org policy constraints, enforced on the whole organization.
    # compute.vmExternalIpAccess is deliberately not set: VMs may have public IPs.
    enforce:
      - iam.disableServiceAccountKeyCreation
      - iam.disableServiceAccountKeyUpload
      - iam.automaticIamGrantsForDefaultServiceAccounts
      - compute.skipDefaultNetworkCreation
      - compute.requireOsLogin
      - compute.disableSerialPortAccess
      - compute.disableNestedVirtualization
      - compute.disableGuestAttributesAccess
      - compute.restrictXpnProjectLienRemoval
      - storage.uniformBucketLevelAccess
      - storage.publicAccessPrevention
    allowed_locations: ["in:asia-southeast1-locations"]
    # iam.allowedPolicyMemberDomains is set to gcp.customer_id (nasir.id only).
